# Hospital Management platform: API + PostgreSQL + Keycloak.
#
#   cp .env.example .env      (then set the three passwords in .env)
#   docker compose up --build
#
# API (Swagger):   http://localhost:5117/swagger
# Keycloak:        http://localhost:8080   (admin console: KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD)
#
# No password is stored in this repository. The stack refuses to start until
# POSTGRES_PASSWORD, KEYCLOAK_ADMIN_PASSWORD and DEV_USERS_PASSWORD are set in .env (git-ignored).
#
# This file holds the safe defaults: no sample data, no Swagger. "docker compose up" also loads
# docker-compose.override.yml, which turns both on for local development. To run without the
# development extras:   docker compose -f docker-compose.yml up --build
# Still not production-ready: no TLS and Keycloak in dev mode (see docs/testing/QUALITY_GATES.md §7).

name: hospitalmanagement

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: hospitaldb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate "keycloak" database on first start.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hospitaldb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # start-dev: HTTP only, no build step. Use "start" with TLS for a real deployment.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env (see .env.example)}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-hospital}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      # Tokens always carry the browser-facing URL as issuer, while the API
      # fetches signing keys over the internal network (http://keycloak:8080).
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm file on first import: password of the four sample users.
      DEV_USERS_PASSWORD: ${DEV_USERS_PASSWORD:?Set DEV_USERS_PASSWORD in .env (see .env.example)}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; probe the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__hospitaldb: Host=postgres;Port=5432;Database=hospitaldb;Username=${POSTGRES_USER:-hospital};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      Keycloak__Authority: http://keycloak:8080/realms/HospitalRealm
      Keycloak__Issuer: http://localhost:8080/realms/HospitalRealm
      Keycloak__RequireHttpsMetadata: "false"
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "false"
      Swagger__Enabled: "false"
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "127.0.0.1:${API_PORT:-5117}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
