# Weekly dependency updates (R-040). Each update is an ordinary pull request: the CI gates run on it and a person
# reviews and merges it (QUALITY_GATES G8). Actions are pinned to commit SHAs; Dependabot moves the SHA and the
# version comment together. Minor and patch updates are grouped to keep the number of pull requests small.
#
# No major versions for NuGet and npm: a major upgrade is a deliberate change a person makes and tests (as the
# Vite 8 upgrade in #32 was). For .NET, Microsoft.EntityFrameworkCore.*, Microsoft.Extensions.* and
# Microsoft.AspNetCore.* package majors must match the solution's .NET 10 target.
# Cooldown: a version is proposed only once it has been published for 14 days. A hijacked or broken release is
# usually found and pulled within days; waiting keeps it out of this repository. Security updates for a known
# vulnerability are not delayed by the cooldown, and the G1 audit still fails a vulnerable package at once.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # OpenTelemetry 1.21 pulls Microsoft.Extensions.* 11 in transitively, which does not build against .NET 10
      # (CS1705, #33). Lift this when the .NET 10-compatible OpenTelemetry package set is available.
      - dependency-name: "OpenTelemetry*"
        versions: [">=1.21.0"]
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend-web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # Container images are pinned to a digest (R-040); Dependabot moves the tag's digest and proposes newer tags.
  # Major versions follow the runtime (.NET 10, Node 24, PostgreSQL 17, Keycloak 26) and are changed by a person.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend/api, /frontend-web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
