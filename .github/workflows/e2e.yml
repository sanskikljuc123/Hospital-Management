# Quality gate G7 (docs/testing/QUALITY_GATES.md §1): end-to-end journeys against the real stack —
# Keycloak, the API, PostgreSQL (docker compose) and the production build of the web frontend.
# Runs on merges to master, nightly, on demand, on pull requests labelled "e2e", and on every pull request that
# touches sign-in (see the "changes" job). No retries, no AI step.
# The job "End-to-end journeys (G7)" is a required check on master: when a pull request does not touch sign-in it
# reports Skipped, which GitHub counts as passed; when it does, the journeys must pass before merge.
name: E2E

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does this pull request touch sign-in? Plain git, no third-party action. The paths are where a change can break
  # the real Keycloak sign-in that only the E2E journeys exercise (API tests use test-signed tokens).
  changes:
    name: Does this change touch sign-in?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      sign_in: ${{ steps.diff.outputs.sign_in }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "Changed files:"; echo "$changed"
          pattern='^(backend/api/Auth/|backend/api/Program\.cs$|keycloak/|frontend-web/src/auth/|docker-compose[^/]*\.ya?ml$|e2e/|\.github/workflows/e2e\.yml$)'
          if echo "$changed" | grep -Eq "$pattern"; then
            echo "sign_in=true" >> "$GITHUB_OUTPUT"
            echo "Touches sign-in: the journeys run."
          else
            echo "sign_in=false" >> "$GITHUB_OUTPUT"
            echo "Does not touch sign-in: the journeys are skipped."
          fi

  e2e:
    name: End-to-end journeys (G7)
    needs: changes
    # Fail-safe: if the change detection itself did not succeed, the journeys run rather than being skipped,
    # because a skipped required check counts as passed.
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'e2e')
        || needs.changes.outputs.sign_in == 'true'
        || needs.changes.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      # Fresh random passwords for this run only; nothing is stored in the repository.
      - name: Create .env for the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^KEYCLOAK_ADMIN_PASSWORD=.*/KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^DEV_USERS_PASSWORD=.*/DEV_USERS_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: Start PostgreSQL, Keycloak and the API
        run: docker compose up -d --build --wait

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5117/health)" = 200 ] && exit 0
            sleep 2
          done
          echo "API did not become healthy"; exit 1

      - name: Build and serve the web frontend (production build)
        working-directory: frontend-web
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 3000 --strictPort > ../vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 200 ] && exit 0
            sleep 2
          done
          echo "Frontend did not start"; cat ../vite-preview.log; exit 1

      - name: Build the E2E tests and install Chromium
        run: |
          dotnet build e2e/HospitalManagement.E2E
          pwsh e2e/HospitalManagement.E2E/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run the journeys
        run: |
          set -a; . ./.env; set +a
          dotnet test e2e/HospitalManagement.E2E --no-build \
            --logger "trx;LogFileName=e2e.trx" --results-directory test-results

      - name: Upload results and Playwright traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            test-results
            e2e/HospitalManagement.E2E/bin/Debug/net8.0/TestResults/traces
          retention-days: 14

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
