# Quality gate G7 (docs/testing/QUALITY_GATES.md §1): end-to-end journeys against the real stack —
# Keycloak, the API, PostgreSQL (docker compose) and the production build of the web frontend.
# Runs on merges to master, nightly, on demand, and on pull requests labelled "e2e". No retries, no AI step.
name: E2E

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end journeys (G7)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      # Fresh random passwords for this run only; nothing is stored in the repository.
      - name: Create .env for the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^KEYCLOAK_ADMIN_PASSWORD=.*/KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^DEV_USERS_PASSWORD=.*/DEV_USERS_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: Start PostgreSQL, Keycloak and the API
        run: docker compose up -d --build --wait

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5117/health)" = 200 ] && exit 0
            sleep 2
          done
          echo "API did not become healthy"; exit 1

      - name: Build and serve the web frontend (production build)
        working-directory: frontend-web
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 3000 --strictPort > ../vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 200 ] && exit 0
            sleep 2
          done
          echo "Frontend did not start"; cat ../vite-preview.log; exit 1

      - name: Build the E2E tests and install Chromium
        run: |
          dotnet build e2e/HospitalManagement.E2E
          pwsh e2e/HospitalManagement.E2E/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run the journeys
        run: |
          set -a; . ./.env; set +a
          dotnet test e2e/HospitalManagement.E2E --no-build \
            --logger "trx;LogFileName=e2e.trx" --results-directory test-results

      - name: Upload results and Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results
            e2e/HospitalManagement.E2E/bin/Debug/net8.0/TestResults/traces
          retention-days: 14

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
