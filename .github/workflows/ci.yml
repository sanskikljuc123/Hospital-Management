# Quality gates G1–G6 (docs/testing/QUALITY_GATES.md §1; G7 is e2e.yml, G9 mutation.yml, G10 codeql.yml).
# No step calls an AI agent.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request cancels the older run. Every other run (a merge to master, nightly,
  # on demand) has a group of its own commit: GitHub also cancels a *pending* run of the same group, so a
  # shared group on master would leave some merge commits unverified.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests (G1, G2, G3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # NuGet audit (Directory.Build.props): a high or critical vulnerable package fails here (G1, R-040).
      # The E2E project is not in the solution; it is restored here only so its packages are audited on every PR.
      - name: Restore and audit packages
        run: |
          dotnet restore backend/backend.sln
          dotnet restore e2e/HospitalManagement.E2E

      # Every warning, the .NET analyzers' included, is an error here, except NU1900–NU1902 and ASPIRE010
      # (Directory.Build.props, G1).
      - name: Build (G1)
        run: dotnet build backend/backend.sln --no-restore -c Release

      # Formatting (G1): the rules in .editorconfig. A failure is fixed with `dotnet format whitespace <project>`.
      - name: Formatting (G1)
        run: |
          dotnet format whitespace backend/backend.sln --verify-no-changes
          dotnet format whitespace e2e/HospitalManagement.E2E/HospitalManagement.E2E.csproj --verify-no-changes

      - name: Unit tests (G2)
        run: >
          dotnet test backend/tests/HospitalManagement.UnitTests --no-build -c Release
          --logger "trx;LogFileName=unit.trx" --results-directory test-results

      # Real PostgreSQL through Testcontainers (Docker is available on the runner). No retries.
      - name: API tests on .NET 10 (G3)
        run: >
          dotnet test backend/tests/HospitalManagement.ApiTests --no-build -c Release
          --logger "trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results
          retention-days: 14

  frontend:
    name: Frontend build (G1)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      # What reaches the browser: a high or critical vulnerability fails the build (G1, R-040).
      - name: Audit runtime dependencies (G1)
        run: npm audit --omit=dev --audit-level=high
      # Build tools (Vite, esbuild) never ship to the browser; reported as a warning so the gap stays visible.
      - name: Report build-tool vulnerabilities (not gating)
        run: >
          npm audit --audit-level=high
          || echo "::warning title=Build-tool vulnerabilities::npm audit reports high or critical issues in dev dependencies"
      - run: npm run build
      # ESLint (G1): defects that compile and that tests may not reach, e.g. a hook inside an if or with missing
      # dependencies (it found the patient details drawer showing the previous patient's service, R-063).
      - name: Lint (G1)
        run: npm run lint
      # Formatting (G1): Prettier with frontend-web/.prettierrc.json. A failure is fixed with `npm run format`.
      - name: Formatting (G1)
        run: npm run format:check
      # Component tests (G2): forms, tables and slices in jsdom, the API mocked with MSW. The job keeps its name
      # "Frontend build (G1)" because the ruleset requires that check by name (QUALITY_GATES §1).
      - name: Component tests (G2)
        run: npm test

  gates:
    name: Risk coverage and skips (G4, G5)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Risk coverage and skips (G4 a, b; G5)
        run: python3 scripts/check_test_gates.py
      # Part of the same job, so the required check name in the ruleset stays the same.
      - name: Cited paths, lines and code names still exist (G4 c)
        run: python3 -I scripts/check_doc_references.py
      # The required check names in QUALITY_GATES are real jobs, and every gate job is documented there.
      - name: Required check names match the workflows (G4 d)
        run: python3 -I scripts/check_gate_names.py
      # Every ID is defined once in the document that owns it, and every reference resolves (README, Identifiers).
      - name: Tests of the ID check (G4 e)
        run: python3 -I -m unittest discover -s scripts/tests
      - name: IDs defined once and every reference resolves (G4 e)
        run: python3 -I scripts/check_ids.py
      # Shows the person who merges every rating and status change in the register; never fails (G8).
      - name: Risk register changes in this pull request
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -I scripts/register_changes.py "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan (G6)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scans the checked-out files. Old commits still hold the removed legacy password (R-030); scanning
      # them would fail every run, so history before this pull request is out of scope.
      # The image is pinned to a digest (R-040). Dependabot does not see a `docker run`: move tag and digest
      # together by hand, here and in scripts/verify.sh.
      - name: gitleaks, files
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo:ro" zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          detect --no-git --source /repo --redact --no-banner -v
      # Every commit of the pull request: a secret added in one commit and deleted in a later one is not in the
      # files any more, but it stays in the history once merged. safe.directory: the mount belongs to another user.
      - name: gitleaks, commits of this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          detect --source /repo --log-opts="$BASE_SHA..HEAD" --redact --no-banner -v
