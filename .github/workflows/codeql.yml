# Quality gate G10 (docs/testing/QUALITY_GATES.md §1): static analysis with CodeQL. It finds a class of defects the
# tests do not look for: injection, unsafe deserialization, path traversal, a token or secret written to a log,
# missing validation of input that reaches a sink. The C# code is analysed without a build (build-mode none), the
# TypeScript of frontend-web from its source. Runs on every pull request, on merges to master and weekly, with the
# security-and-quality query suite. No AI step.
#
# A finding fails the check through the ruleset's code scanning rule (alerts of severity "high" or above, and
# security alerts "high" or above, block the merge); the results are in the Security tab. A false positive is
# dismissed there with a reason, by a person.
name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (G10) ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - "**/bin/**"
              - "**/obj/**"
              - frontend-web/dist
              - frontend-web/reports
              - "**/node_modules/**"

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
